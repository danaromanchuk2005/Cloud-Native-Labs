global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node-api'
    static_configs:
      - targets: ['node-app-1:3000', 'node-app-2:3000', 'node-app-3:3000']
  - job_name: 'go-api'
    static_configs:
      - targets: ['go-app:8080']
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
